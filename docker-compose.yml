services:
  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: production
      SESSION_SECRET: ${SESSION_SECRET:-change-me-in-dev-use-a-long-random-string}
      SESSION_INSECURE_COOKIES: "1"
      DATABASE_URL: file:/app/data/app.db
    volumes:
      - sqlite_data:/app/data
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 8s

  web:
    build:
      context: .
      dockerfile: client/Dockerfile
    ports:
      - "80:80"
    depends_on:
      - api

volumes:
  sqlite_data: {}
